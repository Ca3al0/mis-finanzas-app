name: Build APK con Permisos, Lector Automatico 24/7 y Widget de Agente (Samsung A36 5G)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17 (Compatible con Capacitor Android 6 y Gradle 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar aplicación y generar APK con Permisos, Lector 24/7 y Widget Interactivo de Agente
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
            npm run build
            WEB_DIR="dist"
          else
            mkdir -p www
            cp index.html www/index.html
            echo '{"name":"mis-finanzas-app","version":"1.0.0","private":true}' > package.json
            WEB_DIR="www"
          fi
          rm -rf android capacitor.config.json capacitor.config.ts
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          npx cap init "Mis Finanzas" com.misfinanzas.personal.a36 --web-dir "$WEB_DIR"
          npx cap add android
          npx cap copy android

          JAVA_DIR="android/app/src/main/java/com/misfinanzas/personal/a36"
          RES_DIR="android/app/src/main/res"
          mkdir -p "$JAVA_DIR"
          mkdir -p "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable" "$RES_DIR/values"

          # 0. Recursos XML para el Widget Nativo de Pantalla de Inicio
          cat << 'EOF' > "$RES_DIR/drawable/widget_bg_editorial.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F6F4EE" />
              <corners android:radius="22dp" />
              <stroke android:width="1.5dp" android:color="#DDD7C8" />
          </shape>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/widget_card_inner.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#E2DDD1" />
          </shape>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/widget_agent_reply_bg.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#EAF5F1" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#0D7A5F" />
          </shape>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/widget_btn_emerald.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0D7A5F" />
              <corners android:radius="12dp" />
          </shape>
          EOF

          cat << 'EOF' > "$RES_DIR/drawable/widget_btn_terracotta.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#C25E00" />
              <corners android:radius="12dp" />
          </shape>
          EOF

          cat << 'EOF' > "$RES_DIR/xml/mis_finanzas_widget_info.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="180dp"
              android:targetCellWidth="4"
              android:targetCellHeight="3"
              android:minResizeWidth="250dp"
              android:minResizeHeight="140dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_mis_finanzas"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > "$RES_DIR/layout/widget_mis_finanzas.xml"
