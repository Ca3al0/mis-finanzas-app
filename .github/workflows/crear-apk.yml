          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.RECEIVE_SMS" /><uses-permission android:name="android.permission.READ_SMS" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><application|' "$MANIFEST"
          sed -i 's|</application>|<service android:name=".BankNotificationListener" android:label="Mis Finanzas Lector Automatico" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service><receiver android:name=".SmsBankReceiver" android:permission="android.permission.BROADCAST_SMS" android:exported="true"><intent-filter android:priority="999"><action android:name="android.provider.Telephony.SMS_RECEIVED" /></intent-filter></receiver><receiver android:name=".MisFinanzasAppWidgetProvider" android:label="Mis Finanzas • Agente y Saldo" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /><action android:name="com.misfinanzas.personal.a36.ACTION_REFRESH_WIDGET" /><action android:name="com.misfinanzas.personal.a36.ACTION_CHECK_LAST_PURCHASE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/mis_finanzas_widget_info" /></receiver><activity android:name=".WidgetAgentDialogActivity" android:theme="@android:style/Theme.DeviceDefault.Dialog.NoActionBar" android:excludeFromRecents="true" android:exported="true" /></application>|' "$MANIFEST"

          # Generar certificado personal propio
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mis Finanzas Personal A36, OU=Personal, O=MisFinanzasA36, L=Bogota, S=CO, C=CO"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK con Lector Automático 24/7 y Widget de Agente
        uses: actions/upload-artifact@v4
        with:
          name: app-finanzas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
