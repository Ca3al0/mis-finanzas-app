name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17 (Compatible con Capacitor Android 6 y Gradle 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar aplicación y generar APK con Lector Nativo de Notificaciones para Samsung A36 5G
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
            npm run build
            WEB_DIR="dist"
          else
            mkdir -p www
            cp index.html www/index.html
            echo '{"name":"mis-finanzas-app","version":"1.0.0","private":true}' > package.json
            WEB_DIR="www"
          fi
          rm -rf android capacitor.config.json capacitor.config.ts
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --legacy-peer-deps
          npx cap init "Mis Finanzas" com.mis.finanzas --web-dir "$WEB_DIR"
          npx cap add android
          npx cap copy android

          # Inyectar Servicio Nativo Android de Lectura de Notificaciones (NotificationListenerService)
          JAVA_DIR="android/app/src/main/java/com/mis/finanzas"
          mkdir -p "$JAVA_DIR"

          cat << 'EOF' > "$JAVA_DIR/BankNotificationListener.java"
          package com.mis.finanzas;

          import android.app.Notification;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BankNotificationListener extends NotificationListenerService {
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  try {
                      if (sbn == null || sbn.getNotification() == null) return;
                      String pkg = sbn.getPackageName() != null ? sbn.getPackageName() : "";
                      if (pkg.equals(getPackageName())) return;

                      Bundle extras = sbn.getNotification().extras;
                      if (extras == null) return;

                      CharSequence titleCs = extras.getCharSequence(Notification.EXTRA_TITLE);
                      CharSequence textCs = extras.getCharSequence(Notification.EXTRA_TEXT);
                      CharSequence bigTextCs = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);

                      String title = titleCs != null ? titleCs.toString() : "";
                      String body = bigTextCs != null ? bigTextCs.toString() : (textCs != null ? textCs.toString() : "");
                      String fullText = (title + ": " + body).trim();

                      String low = (pkg + " " + fullText).toLowerCase();
                      if (low.contains("$") || low.contains("compra") || low.contains("recibiste") ||
                          low.contains("pagaste") || low.contains("nequi") || low.contains("bancolombia") ||
                          low.contains("daviplata") || low.contains("nu") || low.contains("transferencia") ||
                          low.contains("abono") || low.contains("davivienda") || low.contains("bbva")) {

                          SharedPreferences prefs = getSharedPreferences("mis_finanzas_notifs", MODE_PRIVATE);
                          String currentJson = prefs.getString("queue", "[]");
                          JSONArray arr = new JSONArray(currentJson);

                          JSONObject item = new JSONObject();
                          item.put("app", title.isEmpty() ? pkg : title);
                          item.put("text", fullText);
                          item.put("time", System.currentTimeMillis());
                          arr.put(item);

                          prefs.edit().putString("queue", arr.toString()).apply();
                      }
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/MainActivity.java"
          package com.mis.finanzas;

          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new AndroidNativeBridge(), "AndroidNativeBridge");
                  }
              }

              public class AndroidNativeBridge {
                  @JavascriptInterface
                  public void openNotificationSettings() {
                      Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  }

                  @JavascriptInterface
                  public boolean isNotificationListenerEnabled() {
                      String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      if (flat != null) {
                          ComponentName cn = new ComponentName(MainActivity.this, BankNotificationListener.class);
                          return flat.contains(cn.flattenToString());
                      }
                      return false;
                  }

                  @JavascriptInterface
                  public String getCapturedNotificationsJson() {
                      SharedPreferences prefs = getSharedPreferences("mis_finanzas_notifs", MODE_PRIVATE);
                      return prefs.getString("queue", "[]");
                  }

                  @JavascriptInterface
                  public void clearCapturedNotifications() {
                      SharedPreferences prefs = getSharedPreferences("mis_finanzas_notifs", MODE_PRIVATE);
                      prefs.edit().putString("queue", "[]").apply();
                  }
              }
          }
          EOF

          # Registrar el servicio en AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</application>|<service android:name=".BankNotificationListener" android:label="Mis Finanzas Lector Bancario" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service></application>|' "$MANIFEST"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: app-finanzas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
