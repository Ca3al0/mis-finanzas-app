name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Instalar Capacitor y herramientas PWA para Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mis Finanzas" com.mis.finanzas --web-dir .
          npx cap add android

      - name: 5. Generar APK nativa en modo Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Subir el APK generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-finanzas-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
