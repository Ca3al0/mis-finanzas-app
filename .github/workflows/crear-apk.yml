name: Build Native Android APK (Samsung A36 5G)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compilar Aplicación y Empaquetar APK Nativo Android
        run: |
          npm install
          npm run build
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          [ -f capacitor.config.json ] || npx cap init "Mis Finanzas" com.mis.finanzas --web-dir dist
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-finanzas-samsung-a36-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
