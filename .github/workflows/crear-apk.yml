          EOF

          # 1. Proveedor Nativo del Widget de Pantalla de Inicio
          cat << 'EOF' > "$JAVA_DIR/MisFinanzasAppWidgetProvider.java"
          package com.misfinanzas.personal.a36;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class MisFinanzasAppWidgetProvider extends AppWidgetProvider {
              public static final String ACTION_REFRESH_WIDGET = "com.misfinanzas.personal.a36.ACTION_REFRESH_WIDGET";
              public static final String ACTION_CHECK_LAST_PURCHASE = "com.misfinanzas.personal.a36.ACTION_CHECK_LAST_PURCHASE";

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int widgetId : appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, widgetId);
                  }
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (intent == null || intent.getAction() == null) return;
                  String action = intent.getAction();

                  if (ACTION_REFRESH_WIDGET.equals(action)) {
                      if (BankNotificationListener.instance != null) {
                          BankNotificationListener.instance.scanAllActiveNotifications();
                      }
                      SharedPreferences prefs = context.getSharedPreferences("mis_finanzas_notifs", Context.MODE_PRIVATE);
                      prefs.edit().putString("widget_agent_reply", "Escáner sincronizado ahora mismo. Datos actualizados en vivo.").apply();
                      updateAllWidgets(context);
                  } else if (ACTION_CHECK_LAST_PURCHASE.equals(action)) {
                      if (BankNotificationListener.instance != null) {
                          BankNotificationListener.instance.scanAllActiveNotifications();
                      }
                      SharedPreferences prefs = context.getSharedPreferences("mis_finanzas_notifs", Context.MODE_PRIVATE);
                      String lastTitle = prefs.getString("widget_last_title", "Sin compras registradas hoy");
                      String lastMeta = prefs.getString("widget_last_meta", "");
                      String reply;
                      if (lastTitle == null || lastTitle.contains("Sin compras")) {
                          reply = "Revisé el escáner y aún no hay compras registradas hoy. Toca 'Hablar Agente' para anotar una.";
                      } else {
                          reply = "Sí, ya registré tu última compra: " + lastTitle + " (" + lastMeta + "). Sin duplicados.";
                      }
                      prefs.edit().putString("widget_agent_reply", reply).apply();
                      updateAllWidgets(context);
                  }
              }

              public static void updateAllWidgets(Context context) {
                  try {
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      ComponentName componentName = new ComponentName(context, MisFinanzasAppWidgetProvider.class);
                      int[] ids = manager.getAppWidgetIds(componentName);
                      if (ids != null && ids.length > 0) {
                          for (int id : ids) {
                              updateSingleWidget(context, manager, id);
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              public static void updateSingleWidget(Context context, AppWidgetManager manager, int appWidgetId) {
                  try {
                      SharedPreferences prefs = context.getSharedPreferences("mis_finanzas_notifs", Context.MODE_PRIVATE);
                      String disponible = prefs.getString("widget_disponible", "$0");
                      String gastos = prefs.getString("widget_gastos", "$0");
                      String fijos = prefs.getString("widget_fijos", "$0");
                      String lastTitle = prefs.getString("widget_last_title", "Sin compras registradas hoy");
                      String lastMeta = prefs.getString("widget_last_meta", "Escáner 24/7 activo esperando notificaciones");
                      String agentReply = prefs.getString("widget_agent_reply", "Toca abajo para preguntarme si ya registré tu compra o anotar un gasto.");

                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_mis_finanzas);
                      views.setTextViewText(R.id.widget_disponible_val, disponible);
                      views.setTextViewText(R.id.widget_gastos_val, gastos);
                      views.setTextViewText(R.id.widget_fijos_val, fijos);
                      views.setTextViewText(R.id.widget_last_purchase_title, lastTitle);
                      views.setTextViewText(R.id.widget_last_purchase_meta, lastMeta);
                      views.setTextViewText(R.id.widget_agent_reply_text, "Agente: " + agentReply);

                      int flags = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

                      // Abrir app al tocar tarjeta superior
                      Intent openAppIntent = new Intent(context, MainActivity.class);
                      openAppIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent openAppPi = PendingIntent.getActivity(context, 200, openAppIntent, flags);
                      views.setOnClickPendingIntent(R.id.widget_last_purchase_box, openAppPi);

                      // Botón Refrescar / Escanear
                      Intent refreshIntent = new Intent(context, MisFinanzasAppWidgetProvider.class);
                      refreshIntent.setAction(ACTION_REFRESH_WIDGET);
                      PendingIntent refreshPi = PendingIntent.getBroadcast(context, 201, refreshIntent, flags);
                      views.setOnClickPendingIntent(R.id.widget_btn_refresh, refreshPi);

                      // Botón Verificar Compra al instante en el mismo widget
                      Intent checkIntent = new Intent(context, MisFinanzasAppWidgetProvider.class);
                      checkIntent.setAction(ACTION_CHECK_LAST_PURCHASE);
                      PendingIntent checkPi = PendingIntent.getBroadcast(context, 202, checkIntent, flags);
                      views.setOnClickPendingIntent(R.id.widget_btn_check_purchase, checkPi);

                      // Botón Hablar con Agente (abre diálogo flotante rápido sobre la pantalla de inicio)
                      Intent askIntent = new Intent(context, WidgetAgentDialogActivity.class);
                      askIntent.putExtra("mode", "chat");
                      askIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent askPi = PendingIntent.getActivity(context, 203, askIntent, flags);
                      views.setOnClickPendingIntent(R.id.widget_btn_ask_agent, askPi);
                      views.setOnClickPendingIntent(R.id.widget_agent_reply_box, askPi);

                      // Botón Voz en el Widget
                      Intent voiceIntent = new Intent(context, WidgetAgentDialogActivity.class);
                      voiceIntent.putExtra("mode", "voice");
                      voiceIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent voicePi = PendingIntent.getActivity(context, 204, voiceIntent, flags);
                      views.setOnClickPendingIntent(R.id.widget_btn_voice_agent, voicePi);

                      manager.updateAppWidget(appWidgetId, views);
                  } catch (Exception ignored) {
                  }
              }
          }
          EOF

          # 2. Actividad Flotante Rápida del Agente desde el Widget (sin necesidad de abrir toda la app)
          cat << 'EOF' > "$JAVA_DIR/WidgetAgentDialogActivity.java"
          package com.misfinanzas.personal.a36;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.text.NumberFormat;
          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class WidgetAgentDialogActivity extends Activity {
              private static final int REQ_VOICE = 901;
              private TextView answerView;
              private TextView summaryView;
              private EditText inputField;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  LinearLayout outer = new LinearLayout(this);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setPadding(42, 42, 42, 42);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#181815"));
                  bg.setCornerRadius(44f);
                  bg.setStroke(3, Color.parseColor("#0D7A5F"));
                  outer.setBackground(bg);

                  TextView title = new TextView(this);
                  title.setText("🤖 Agente Mis Finanzas • Widget en Vivo");
                  title.setTextColor(Color.parseColor("#F6F4EE"));
                  title.setTextSize(16f);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  outer.addView(title);

                  SharedPreferences prefs = getSharedPreferences("mis_finanzas_notifs", Context.MODE_PRIVATE);
                  String disp = prefs.getString("widget_disponible", "$0");
                  String lastTitle = prefs.getString("widget_last_title", "Sin compras registradas hoy");

                  summaryView = new TextView(this);
                  summaryView.setText("Disponible real: " + disp + "\nÚltima compra: " + lastTitle);
                  summaryView.setTextColor(Color.parseColor("#A6A297"));
                  summaryView.setTextSize(12f);
                  summaryView.setPadding(0, 12, 0, 18);
                  outer.addView(summaryView);

                  answerView = new TextView(this);
                  answerView.setText(prefs.getString("widget_agent_reply", "¿Qué deseas verificar o registrar hoy?"));
                  answerView.setTextColor(Color.parseColor("#10B981"));
                  answerView.setTextSize(13f);
                  answerView.setPadding(28, 24, 28, 24);
                  GradientDrawable ansBg = new GradientDrawable();
                  ansBg.setColor(Color.parseColor("#121210"));
                  ansBg.setCornerRadius(28f);
                  ansBg.setStroke(2, Color.parseColor("#2C2A24"));
                  answerView.setBackground(ansBg);
                  outer.addView(answerView);

                  LinearLayout chipsRow = new LinearLayout(this);
                  chipsRow.setOrientation(LinearLayout.HORIZONTAL);
                  chipsRow.setPadding(0, 20, 0, 14);

                  Button chipCheck = createStyledButton("✓ ¿Ya registraste la compra?", "#C25E00");
                  chipCheck.setOnClickListener(v -> processAgentCommand("¿Ya registraste mi última compra?"));
                  LinearLayout.LayoutParams lpChip1 = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  lpChip1.rightMargin = 8;
                  chipsRow.addView(chipCheck, lpChip1);

                  Button chipVoice = createStyledButton("🎤 Dictar por Voz", "#262420");
                  chipVoice.setOnClickListener(v -> startVoiceRecognition());
                  LinearLayout.LayoutParams lpChip2 = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 0.8f);
                  lpChip2.leftMargin = 8;
                  chipsRow.addView(chipVoice, lpChip2);

                  outer.addView(chipsRow);

                  inputField = new EditText(this);
                  inputField.setHint("Ej: ¿Registraste la compra? o Gasté 35 mil en almuerzo");
                  inputField.setHintTextColor(Color.parseColor("#78746A"));
                  inputField.setTextColor(Color.WHITE);
                  inputField.setTextSize(13f);
                  inputField.setPadding(28, 24, 28, 24);
                  GradientDrawable inBg = new GradientDrawable();
                  inBg.setColor(Color.parseColor("#121210"));
                  inBg.setCornerRadius(24f);
                  inBg.setStroke(2, Color.parseColor("#38352E"));
                  inputField.setBackground(inBg);
                  outer.addView(inputField);

                  LinearLayout actionsRow = new LinearLayout(this);
                  actionsRow.setOrientation(LinearLayout.HORIZONTAL);
                  actionsRow.setGravity(Gravity.END);
                  actionsRow.setPadding(0, 22, 0, 0);

                  Button closeBtn = createStyledButton("Cerrar", "#262420");
                  closeBtn.setOnClickListener(v -> finish());
                  LinearLayout.LayoutParams lpClose = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lpClose.rightMargin = 14;
                  actionsRow.addView(closeBtn, lpClose);

                  Button sendBtn = createStyledButton("Preguntar / Ejecutar", "#0D7A5F");
                  sendBtn.setOnClickListener(v -> {
                      String q = inputField.getText().toString().trim();
                      if (!q.isEmpty()) {
                          processAgentCommand(q);
                          inputField.setText("");
                      }
                  });
                  actionsRow.addView(sendBtn);

                  outer.addView(actionsRow);
                  setContentView(outer);

                  String mode = getIntent() != null ? getIntent().getStringExtra("mode") : null;
                  String initialPrompt = getIntent() != null ? getIntent().getStringExtra("initialPrompt") : null;
                  if (initialPrompt != null && !initialPrompt.trim().isEmpty()) {
                      processAgentCommand(initialPrompt.trim());
                  } else if ("voice".equals(mode)) {
                      startVoiceRecognition();
                  }
              }

              private Button createStyledButton(String text, String hexColor) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(11.5f);
                  b.setPadding(26, 18, 26, 18);
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(Color.parseColor(hexColor));
                  d.setCornerRadius(22f);
                  b.setBackground(d);
                  return b;
              }

              private void startVoiceRecognition() {
                  try {
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-CO");
                      intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "Habla con tu Agente de Mis Finanzas...");
                      startActivityForResult(intent, REQ_VOICE);
                  } catch (ActivityNotFoundException e) {
                      answerView.setText("Tu teléfono no tiene dictado por voz activo. Escribe tu pregunta abajo.");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_VOICE && resultCode == RESULT_OK && data != null) {
                      ArrayList<String> results = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (results != null && !results.isEmpty()) {
                          String spoken = results.get(0);
                          inputField.setText(spoken);
                          processAgentCommand(spoken);
                      }
                  }
              }

              private void processAgentCommand(String rawQuery) {
                  if (BankNotificationListener.instance != null) {
                      BankNotificationListener.instance.scanAllActiveNotifications();
                  }
                  SharedPreferences prefs = getSharedPreferences("mis_finanzas_notifs", Context.MODE_PRIVATE);
                  String low = rawQuery.toLowerCase(Locale.ROOT);
                  String reply;

                  if (low.contains("registr") || low.contains("ultima compra") || low.contains("última compra") || low.contains("ya quedo") || low.contains("ya quedó")) {
                      String lastTitle = prefs.getString("widget_last_title", "Sin compras registradas hoy");
                      String lastMeta = prefs.getString("widget_last_meta", "");
                      if (lastTitle == null || lastTitle.contains("Sin compras")) {
                          reply = "Revisé el escáner en vivo y aún no tienes compras registradas hoy. Si deseas anotar una, dime por ejemplo: 'Gasté 35 mil en almuerzo'.";
                      } else {
                          reply = "✅ Sí, tu última compra ya está registrada: " + lastTitle + " (" + lastMeta + "). El filtro anti-duplicados evitó cobros repetidos.";
                      }
                  } else if (low.contains("disponible") || low.contains("saldo") || low.contains("cuanto tengo") || low.contains("cuánto tengo")) {
                      String disp = prefs.getString("widget_disponible", "$0");
                      String gastos = prefs.getString("widget_gastos", "$0");
                      String fijos = prefs.getString("widget_fijos", "$0");
                      reply = "💰 Tu disponible real es " + disp + " (Compras del mes: " + gastos + " • Pagos fijos pendientes: " + fijos + ").";
                  } else {
                      long amount = extractAmountFromNaturalText(low);
                      if (amount > 0) {
                          boolean isIncome = low.contains("recib") || low.contains("gan") || low.contains("ingres") || low.contains("abono") || low.contains("nomina") || low.contains("nómina");
                          String bank = "Agente Widget";
                          if (low.contains("nequi")) bank = "Nequi";
                          else if (low.contains("bancolombia")) bank = "Bancolombia";
                          else if (low.contains("daviplata")) bank = "Daviplata";
                          else if (low.contains("nu")) bank = "Nu";

                          String syntheticNotif = (isIncome ? "Recibiste $" : "Compra aprobada por $") + amount + " en " + rawQuery;
                          BankNotificationListener.saveAndBroadcastNotification(this, bank, syntheticNotif, System.currentTimeMillis());

                          NumberFormat nf = NumberFormat.getCurrencyInstance(new Locale("es", "CO"));
                          nf.setMaximumFractionDigits(0);
                          String formattedAmt = nf.format(amount);
                          reply = "✅ Listo, registré desde el widget: " + formattedAmt + " (" + bank + "). Tus gráficas y tablas ya se actualizaron.";
                      } else {
                          String lastTitle = prefs.getString("widget_last_title", "Sin compras registradas hoy");
                          String disp = prefs.getString("widget_disponible", "$0");
                          reply = "Disponible real: " + disp + ". Última compra: " + lastTitle + ". Puedes decirme 'Gasté 25 mil en taxi' o '¿Ya registraste mi compra?'.";
                      }
                  }

                  prefs.edit().putString("widget_agent_reply", reply).apply();
                  answerView.setText(reply);
                  summaryView.setText("Disponible real: " + prefs.getString("widget_disponible", "$0") + "\nÚltima compra: " + prefs.getString("widget_last_title", "Sin compras registradas hoy"));
                  MisFinanzasAppWidgetProvider.updateAllWidgets(this);
              }

              private long extractAmountFromNaturalText(String text) {
                  try {
                      Matcher mMil = Pattern.compile("(\\d+(?:[.,]\\d+)?)\\s*mil\\b").matcher(text);
                      if (mMil.find()) {
                          double v = Double.parseDouble(mMil.group(1).replace(",", "."));
                          return Math.round(v * 1000);
                      }
                      Matcher mMillon = Pattern.compile("(\\d+(?:[.,]\\d+)?)\\s*millon").matcher(text);
                      if (mMillon.find()) {
                          double v = Double.parseDouble(mMillon.group(1).replace(",", "."));
                          return Math.round(v * 1000000);
                      }
                      Matcher mNum = Pattern.compile("\\$?\\s*(\\d{1,3}(?:[.,]\\d{3})+|\\d{4,9})").matcher(text);
                      if (mNum.find()) {
                          String raw = mNum.group(1).replace(".", "").replace(",", "");
                          return Long.parseLong(raw);
                      }
                  } catch (Exception ignored) {
                  }
                  return 0L;
              }
          }
